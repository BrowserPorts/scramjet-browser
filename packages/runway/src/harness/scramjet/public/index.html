<!doctype html>
<html>
	<head>
		<title>Scramjet Test Harness</title>
		<script src="/scramjet/scramjet.js"></script>
		<script src="/controller/controller.api.js"></script>
		<script src="/libcurl/index.js"></script>
		<script src="/runway-cleartext-https-transport.js"></script>
		<script src="/runway-plugins.js"></script>
	</head>
	<body>
		<h1>Scramjet Test Harness</h1>
		<div id="status">Initializing...</div>
		<button id="reload-btn" style="display: none; margin: 8px 0">
			🔄 Reload Test
		</button>
		<iframe
			id="testframe"
			style="width: 100%; height: 80vh; border: 1px solid #ccc"
		></iframe>

		<script>
			const statusEl = document.getElementById("status");
			const testframe = document.getElementById("testframe");
			const reloadBtn = document.getElementById("reload-btn");
			const { Controller } = $scramjetController;
			const LibcurlClient = window.LibcurlTransport.LibcurlClient;

			let controller;
			let scramjetFrame;

			async function loadHarnessConfig() {
				// The harness page URL carries this attempt's nonce; forwarding the
				// query string lets the host correlate the transport connection with
				// the test and lane that caused it.
				const response = await fetch(
					`/runway-harness-config.json${location.search}`,
				);
				if (!response.ok)
					throw new Error(`Harness config load failed: ${response.status}`);
				const config = await response.json();
				if (typeof config.wispUrl !== "string" || !config.wispUrl)
					throw new Error("Harness config is missing wispUrl");
				return config;
			}

			async function init() {
				const harnessConfig = await loadHarnessConfig();
				window.__runwayHarnessConfig = harnessConfig;
				const pluginSetup = await prepareRunwayPlugins();
				statusEl.textContent = "Registering service worker...";

				const hostWorker = pluginSetup.profile.serviceWorker;
				const registration = await navigator.serviceWorker.register(
					hostWorker?.url ?? "/sw.js",
					{ scope: "/", type: hostWorker?.type ?? "classic" },
				);

				// Wait for the service worker to be ready
				if (!navigator.serviceWorker.controller) {
					statusEl.textContent = "Waiting for service worker to activate...";
					await new Promise((resolve) => {
						if (registration.active) {
							resolve();
							return;
						}
						const sw = registration.installing || registration.waiting;
						if (sw) {
							sw.addEventListener("statechange", () => {
								if (sw.state === "activated") resolve();
							});
						}
					});
					// Wait for controller
					if (!navigator.serviceWorker.controller) {
						await new Promise((resolve) => {
							navigator.serviceWorker.addEventListener(
								"controllerchange",
								resolve,
								{ once: true }
							);
						});
					}
				}

				statusEl.textContent = "Initializing controller...";

				const innerTransport = new LibcurlClient({
					wisp: harnessConfig.wispUrl,
				});
				const transport = new RunwayCleartextHttpsTransport(innerTransport);

				const sw = navigator.serviceWorker.controller ?? registration.active;
				if (!sw) {
					throw new Error("No service worker available for controller");
				}

				const controllerOptions = {
					serviceworker: sw,
					transport,
					storagePartitionKey: "runway:harness",
				};
				await pluginSetup.configure(controllerOptions);
				controller = new Controller(controllerOptions);
				window.__runwayController = controller;

				await controller.ready;

				scramjetFrame = controller.createFrame(testframe, {
					plugins: pluginSetup.plugins,
				});
				window.__runwayScramjetFrame = scramjetFrame;

				statusEl.textContent = "Ready - waiting for test...";

				window.__runwayNavigate = (url) => {
					statusEl.textContent = `Loading test: ${url}`;
					// Store the URL for reload support
					sessionStorage.setItem("__runway_last_test", url);
					reloadBtn.style.display = "inline-block";
					// injectTestFunctions();
					console.log("navigating to", url);
					scramjetFrame.go(url);
				};

				window.__runwayGetProxiedUrl = (url) => {
					return $scramjet.rewriteUrl(url, scramjetFrame.context, {
						origin: new URL(location.href),
						base: new URL(location.href),
					});
				};

				// The controller-owned case frame, for a host that drives navigation
				// itself instead of going through __runwayNavigate.
				//
				// `element` is the very element this controller passed to createFrame, so
				// a host can designate the frame by identity rather than by querying for
				// something that looks right. Guest content inside the frame cannot
				// substitute it, and a same-origin guest that later injects a lookalike
				// into this document cannot either, because the host captures the element
				// before anything is navigated.
				//
				// `encode` must produce the URL Frame.go() would really load, so it
				// mirrors that call exactly — same context, same meta, and the same
				// `destination: "document"`, which is a query parameter on the rewritten
				// URL and therefore part of the physical identity. Omitting it (as
				// __runwayGetProxiedUrl above does) yields a URL that is *close to* but
				// not the one the controller navigates to.
				window.__runwayCaseFrame = {
					element: scramjetFrame.element,
					prefix: scramjetFrame.context.prefix.href,
					encode: (url) =>
						$scramjet.rewriteUrl(
							url,
							scramjetFrame.context,
							{
								origin: new URL(location.href),
								base: new URL(location.href),
							},
							{ destination: "document" },
						),
					decode: (url) =>
						$scramjet.unrewriteUrl(url, scramjetFrame.context),
				};

				window.__runwayReload = () => {
					const lastTest = sessionStorage.getItem("__runway_last_test");
					if (lastTest) {
						window.__runwayNavigate(lastTest);
					}
				};

				reloadBtn.addEventListener("click", window.__runwayReload);

				// Auto-navigate to last test on reload
				const lastTest = sessionStorage.getItem("__runway_last_test");
				if (lastTest) {
					console.log("Reloading last test:", lastTest);
					window.__runwayNavigate(lastTest);
				}

				console.log("Harness ready, __runwayNavigate exposed");
			}

			init().catch((err) => {
				statusEl.textContent = `Error: ${err.message}`;
				console.error("Harness init error:", err);
			});
		</script>
	</body>
</html>
